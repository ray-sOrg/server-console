name: Build & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_NAME: server-console
  K8S_DEPLOYMENT_FILE: deployment.yaml
  ROLLOUT_TIMEOUT: 180
  HEALTH_CHECK_HOST: api.tt829.cn
  HEALTH_CHECK_PATH: /health

jobs:
  deploy:
    name: Build & Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Record deployment start
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_NAME="localhost/${{ env.PROJECT_NAME }}"
          IMAGE_TAG="build-${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD)"
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE_NAME:$IMAGE_TAG"

      - name: Package deployment source
        id: source
        run: |
          git archive --format=tar.gz --output "$RUNNER_TEMP/deployment-source.tar.gz" HEAD
          (
            cd "$RUNNER_TEMP"
            sha256sum deployment-source.tar.gz > deployment-source.tar.gz.sha256
          )
          printf '%s\n' "${{ steps.meta.outputs.tag }}" > "$RUNNER_TEMP/deployment-image-tag"
          echo "size=$(du -h "$RUNNER_TEMP/deployment-source.tar.gz" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare deployment manifest
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"
          sed -i "s|__IMAGE_NAME__|$IMAGE|g" "${{ env.K8S_DEPLOYMENT_FILE }}"
          sed -i "s|__IMAGE_TAG__|$TAG|g" "${{ env.K8S_DEPLOYMENT_FILE }}"
          echo "Deploying: $IMAGE:$TAG"

      - name: Upload source and deployment manifest
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync \
            --archive \
            --partial \
            --timeout=120 \
            -e "ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=4" \
            "$RUNNER_TEMP/deployment-source.tar.gz" \
            "$RUNNER_TEMP/deployment-source.tar.gz.sha256" \
            "$RUNNER_TEMP/deployment-image-tag" \
            "${{ env.K8S_DEPLOYMENT_FILE }}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:"

      - name: Build and import image on k3s node
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'sudo -n /usr/local/sbin/k3s-build-deployment-image'

      - name: Apply deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'export KUBECONFIG="$HOME/.kube/config"; kubectl apply -f "$HOME/deployment.yaml"; status=$?; rm -f "$HOME/deployment.yaml"; exit $status'

      - name: Verify deployment and service route
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          DEPLOYMENT="${{ env.PROJECT_NAME }}-deployment"
          if ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "export KUBECONFIG=\"\$HOME/.kube/config\"; kubectl rollout status deployment/$DEPLOYMENT --timeout=${{ env.ROLLOUT_TIMEOUT }}s && curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 15 -H 'Host: ${{ env.HEALTH_CHECK_HOST }}' 'http://127.0.0.1${{ env.HEALTH_CHECK_PATH }}' >/dev/null"; then
            echo "Deployment and route check succeeded"
          else
            echo "Deployment check failed; rolling back"
            ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "export KUBECONFIG=\"\$HOME/.kube/config\"; kubectl rollout undo deployment/$DEPLOYMENT && kubectl rollout status deployment/$DEPLOYMENT --timeout=${{ env.ROLLOUT_TIMEOUT }}s"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployment: ${{ job.status }}"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- Source archive: \`${{ steps.source.outputs.size }}\`"
            echo "- Host: \`${{ env.HEALTH_CHECK_HOST }}\`"
            echo "- Registry: bypassed (built on k3s node)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify WeCom
        if: always()
        continue-on-error: true
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          if [ -z "$WECOM_WEBHOOK_URL" ]; then
            echo "::warning::WECOM_WEBHOOK_URL is not configured; skipping notification"
            exit 0
          fi

          ELAPSED=$(( $(date +%s) - ${DEPLOY_STARTED_AT:-$(date +%s)} ))
          DURATION="$((ELAPSED / 60))m $((ELAPSED % 60))s"
          COMMIT_SHA="$(git rev-parse HEAD 2>/dev/null || printf '%s' "$GITHUB_SHA")"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_SUBJECT="$(git log -1 --pretty=%s 2>/dev/null || printf 'Unavailable')"
          SERVICE_URL="https://${HEALTH_CHECK_HOST}${HEALTH_CHECK_PATH}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}"

          if [ "$DEPLOY_STATUS" = "success" ]; then
            TITLE="### Deployment succeeded"
            COLOR="info"
          else
            TITLE="### Deployment ${DEPLOY_STATUS}"
            COLOR="warning"
          fi

          CONTENT="$(jq -n -r \
            --arg title "$TITLE" \
            --arg color "$COLOR" \
            --arg project "$PROJECT_NAME" \
            --arg status "$DEPLOY_STATUS" \
            --arg duration "$DURATION" \
            --arg subject "$COMMIT_SUBJECT" \
            --arg short_sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" \
            --arg service_url "$SERVICE_URL" \
            --arg run_url "$RUN_URL" \
            '$title + "\n> Project: **" + $project + "**\n> Status: <font color=\"" + $color + "\">" + $status + "</font>\n> Duration: " + $duration + "\n> Commit: [" + $short_sha + "](" + $commit_url + ") " + $subject + "\n> Service: [" + $service_url + "](" + $service_url + ")\n> Details: [GitHub Actions](" + $run_url + ")"')"
          PAYLOAD="$(jq -n --arg content "$CONTENT" \
            '{msgtype: "markdown", markdown: {content: $content}}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD" \
            "$WECOM_WEBHOOK_URL")"
          echo "$RESPONSE"
          test "$(jq -r '.errcode // -1' <<< "$RESPONSE")" = "0"
