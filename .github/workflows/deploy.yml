name: Build & Deploy

on:
  push:
    branches: [main, develop]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: server-console
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: ray321
  K8S_DEPLOYMENT_FILE: deployment.yaml
  ROLLOUT_TIMEOUT: 180
  HEALTH_CHECK_HOST: api.tt829.cn
  HEALTH_CHECK_PATH: /health

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Tencent TCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Generate image metadata
        id: meta
        shell: bash
        run: |
          IMAGE_NAME="${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.PROJECT_NAME }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/v}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            IMAGE_TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          elif [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            IMAGE_TAG="develop-${SHORT_SHA}"
          else
            IMAGE_TAG="$SHORT_SHA"
          fi

          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE_NAME:$IMAGE_TAG"

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Kubernetes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare deployment manifest
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          TAG="${{ needs.build.outputs.tag }}"
          sed -i "s|__IMAGE_NAME__|$IMAGE|g" "${{ env.K8S_DEPLOYMENT_FILE }}"
          sed -i "s|__IMAGE_TAG__|$TAG|g" "${{ env.K8S_DEPLOYMENT_FILE }}"
          echo "Deploying: $IMAGE:$TAG"

      - name: Upload deployment manifest
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -o BatchMode=yes \
            "${{ env.K8S_DEPLOYMENT_FILE }}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${{ env.PROJECT_NAME }}-deployment.yaml"

      - name: Apply deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'export KUBECONFIG="$HOME/.kube/config"; kubectl apply -f "$HOME/server-console-deployment.yaml"; status=$?; rm -f "$HOME/server-console-deployment.yaml"; exit $status'

      - name: Verify deployment and service route
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          DEPLOYMENT="${{ env.PROJECT_NAME }}-deployment"
          if ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "export KUBECONFIG=\"\$HOME/.kube/config\"; kubectl rollout status deployment/$DEPLOYMENT --timeout=${{ env.ROLLOUT_TIMEOUT }}s && curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 15 -H 'Host: ${{ env.HEALTH_CHECK_HOST }}' 'http://127.0.0.1${{ env.HEALTH_CHECK_PATH }}' >/dev/null"; then
            echo "Deployment and route check succeeded"
          else
            echo "Deployment check failed; rolling back"
            ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "export KUBECONFIG=\"\$HOME/.kube/config\"; kubectl rollout undo deployment/$DEPLOYMENT && kubectl rollout status deployment/$DEPLOYMENT --timeout=${{ env.ROLLOUT_TIMEOUT }}s"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployment: ${{ job.status }}"
            echo ""
            echo "- Image: \`${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}\`"
            echo "- Host: \`${{ env.HEALTH_CHECK_HOST }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
